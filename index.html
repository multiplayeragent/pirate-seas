<script type="module">
/* ═══ PIRATE SEAS · a Multiplayer Agent starter ═════════════════════════════════════════
 * Sail, fire broadsides, sink rivals, grab the treasure. Drop-in, 2–16 players; bot ships
 * fill the sea so one person alone still has rivals.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ ship speed, cannons, treasure, bots, upgrade prices
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEA ........... renderer, waves, the archipelago built from the room's seed

 *   TREASURE ...... floating barrels and chests (instanced)

 *   HOST .......... bot captains, treasure spawns, who grabbed what, sunk ships' loot.
 *                   Only the host runs this and writes the shared fields.
 *   ME ............ sailing, firing, getting hit, sinking, setting sail again

 *     about 10 times a second, `hb` (heartbeat) once a second, `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `sea`    {id, v, seed}: the archipelago seed (every client builds the same islands)
 *       `loot`   {n, l}: every floating treasure [id, x, z, gold, kind] + the next id
 *       `awards` the last 30 pickups and bounties [id, gold, player, sunk ship's name]

 *     balls count (the host counts its bots'): a hit sends "hit" {to, d, by}. The ship's
 *     owner takes the damage: a player its own hp, the host a bot's.
 *   - "grab" {i, x, z} (intent): your hull is over treasure. The host gives it to the first who
 *     asks and writes it in `awards`; you add the gold to your own haul and purse.
 *   - Sinking: you set your own `p.dn` and bump `p.sk`. The host sees that in state, spills
 *     part of your haul as treasure and pays the bounty to whoever sank you.
 *   - Your purse, upgrades and best haul are YOUR save (player.data, CONFIG.saveNs), not room

 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-haul": the most gold one ship carried before it sank.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────

  islands: 11,           // islands in the archipelago (placed from the room's seed)
  treasure: 24,          // floating treasure kept on the sea at once
  treasureEvery: 1.2,    // seconds between new treasure while there is less than that
  barrelGold: [5, 9],    // gold in a barrel (min, max)
  chestGold: [12, 24],   // gold in a chest
  goldMultiplier: 1,     // live ops can raise this for a gold rush event

const maxHp = (lv) => CONFIG.hp + 30 * lv[0];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────

const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'pirate-seas',
  endpoint: 'wss://live.multiplayeragent.com',

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */

const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

const liveNum = (key) => { const v = Number(net && net.live && net.live.config ? net.live.config[key] : NaN); return Number.isFinite(v) ? v : CONFIG[key]; };

// ── SEA ─────────────────────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = "#9fd8ee";
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 75, 190);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 400);
let tagSize = 0.05; // name tags are a fixed 26px tall on any screen
function fit() {

  camera.fov = innerHeight > innerWidth ? 62 : 50; camera.updateProjectionMatrix();
  tagSize = (26 * 2 * Math.tan((camera.fov * Math.PI) / 360)) / innerHeight;
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#d8f3ff", "#1b4a63", 1.15));
const sun = new THREE.DirectionalLight("#fff1d0", 2.1);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 140 });
scene.add(sun, sun.target);

function canvasTex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);

}
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/** Height of the sea at (x, z) at time t: three rolling sine waves. Ships and treasure ride it. */
function waveAt(x, z, t) { return 0.24 * Math.sin(x * 0.19 + t * 1.1) + 0.18 * Math.sin(z * 0.23 - t * 0.9 + x * 0.05) + 0.1 * Math.sin((x + z) * 0.45 + t * 1.9); }

const OCEAN = 270, SEG = 90;
const oceanGeo = new THREE.PlaneGeometry(OCEAN, OCEAN, SEG, SEG); oceanGeo.rotateX(-Math.PI / 2);
const oceanPos = oceanGeo.attributes.position, oceanXZ = new Float32Array(oceanPos.count * 2);
for (let i = 0; i < oceanPos.count; i++) { oceanXZ[i * 2] = oceanPos.getX(i); oceanXZ[i * 2 + 1] = oceanPos.getZ(i); }
const ocean = mesh(oceanGeo, std("#1f8fc0", { roughness: 0.3, metalness: 0.05, flatShading: true, transparent: true, opacity: 0.8 }));
ocean.receiveShadow = true; scene.add(ocean);
const farSea = mesh(new THREE.RingGeometry(OCEAN / 2 - 4, 1600, 48).rotateX(-Math.PI / 2), std("#2c86b0", { roughness: 0.5 }), 0, -0.4, 0); scene.add(farSea);
const seabed = mesh(new THREE.PlaneGeometry(OCEAN, OCEAN).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#0d4a6e" }), 0, -3, 0); scene.add(seabed);

  const cell = OCEAN / SEG, ox = Math.round(cx / cell) * cell, oz = Math.round(cz / cell) * cell;
  ocean.position.set(ox, 0, oz); farSea.position.set(ox, -0.4, oz); seabed.position.set(ox, -3, oz);

/** The archipelago from a seed: the same islands on every client. */
function makeIslands(seed) {

/** The islands of the current sea (rebuilt when the seed changes). */
function islands() {

const sandMat = std("#efd9a0", { roughness: 1, flatShading: true }), grassMat = std("#5cb85a", { flatShading: true }), rockMat = std("#8d9096", { flatShading: true });

  focus.lerp(P3.set(me.x + Math.sin(me.h) * me.sp * lead, 0, me.z + Math.cos(me.h) * me.sp * lead), 1 - Math.pow(0.02, dt));
  camera.position.copy(focus).add(camOff);
  if (now - me.hurtAt < 220 && !ATTRACT) camera.position.x += (Math.random() - 0.5) * 0.6;
  camera.lookAt(focus);
  sun.position.set(focus.x + 30, 55, focus.z + 18); sun.target.position.copy(focus);
  updateOcean(t, focus.x, focus.z - 30);
  renderer.render(scene, camera);
  if (saveDirty && now - lastSave > 3000) storeSave();
  if (now - lastHud > 100) { lastHud = now; hud(); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => {
    if (!m) return;
    if (m.to === net.sessionId) hurtMe(m.d, m.by || from);
    else if (host.acting && host.bots.has(m.to)) hitBot(host.bots.get(m.to), m.d, m.by || from);
  });
  net.on("grab", (m, from) => { if (host.acting && m) grab(+m.i, from, { x: +m.x, z: +m.z }); });
  net.on("boom", (m) => { if (m && typeof m.x === "number") broadside({ id: m.i, x: m.x, z: m.z, h: m.h, sp: m.sp || 0, lv: [0, Math.max(0, (m.n || 2) - CONFIG.guns), 0] }, m.s > 0 ? 1 : -1, null); });
  net.on("sunk", (m) => { if (m) addFeed(m); });
  net.onDisconnect(() => { netDown = true; });
  net.onReconnect(() => { netDown = false; });
  joinedAt = performance.now();
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  await Promise.race([loadSave(), new Promise((ok) => setTimeout(ok, 3000))]); // a slow save never holds up the game
  if (ATTRACT) me.lv = [2, 2, 1];
  if (new URLSearchParams(location.search).has("test")) window.__test = { me, host, fleet: () => fleet, S: () => S, isHost, fire, islands, lootList };
  requestAnimationFrame(frame);
})();
